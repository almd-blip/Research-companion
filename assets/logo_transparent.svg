<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Sweep gradient for watercolor paint stroke brush circle -->
    <linearGradient id="brushGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a9396" /> <!-- deep teal -->
      <stop offset="35%" stop-color="#94d2bd" /> <!-- light teal -->
      <stop offset="70%" stop-color="#ee9b00" /> <!-- warm gold -->
      <stop offset="100%" stop-color="#cc1133" /> <!-- rich burgundy/red -->
    </linearGradient>
    <filter id="subtleShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(10, -10)">
    <!-- Brush stroke circle icon on the left -->
    <g transform="translate(110, 150)" filter="url(#subtleShadowDark)">
      <!-- Multi-arc textured paint ring representing look, ask, second thought -->
      <!-- Left & Bottom stroke -->
      <path d="M -30,-80 A 85,85 0 1,0 75,45" fill="none" stroke="url(#brushGradDark)" stroke-width="16" stroke-linecap="round" opacity="0.95" />
      
      <!-- Faded accent inner strokes for watercolor texture depth -->
      <path d="M -45,-55 A 80,80 0 1,0 55,60" fill="none" stroke="#0a9396" stroke-width="6" stroke-linecap="round" opacity="0.5" />
      <path d="M -15,-90 A 90,90 0 0,1 65,-45" fill="none" stroke="#ee9b00" stroke-width="8" stroke-linecap="round" opacity="0.75" />
      
      <!-- Right-side burgundy brush return -->
      <path d="M 60,-65 A 85,85 0 0,1 78,40" fill="none" stroke="#cc1133" stroke-width="14" stroke-linecap="round" opacity="0.9" />

      <!-- Splatters / Dots on the upper-right sweep (Teal, Gold, Burgundy) -->
      <circle cx="72" cy="-56" r="8" fill="#0a9396" />
      <circle cx="85" cy="-34" r="9" fill="#ee9b00" />
      <circle cx="92" cy="-8" r="7" fill="#cc1133" />

      <!-- Centered "ST" overlapping initials with high quality typeface styling (cream colored for dark background) -->
      <text x="-25" y="24" font-family="'Inter', 'Playfair Display', 'Georgia', serif" font-size="76" font-weight="200" fill="#fdfbf7" letter-spacing="-3" opacity="0.95">S</text>
      <text x="14" y="38" font-family="'Inter', 'Playfair Display', 'Georgia', serif" font-size="60" font-weight="300" fill="#fdfbf7" opacity="0.95">T</text>
    </g>

    <!-- Right-side Corporate/Academic Typography Group -->
    <g transform="translate(270, 0)">
      <!-- "Second Thought" title in elegant display font (cream/white) -->
      <text x="0" y="145" font-family="'Inter', 'Outfit', 'Trebuchet MS', sans-serif" font-size="74" font-weight="300" fill="#fdfbf7" letter-spacing="4">Second Thought</text>
      
      <!-- Styled Burgundy Divider and "Publishing" Subtitle -->
      <!-- Left line segment -->
      <line x1="0" y1="192" x2="110" y2="192" stroke="#cc1133" stroke-width="4.5" stroke-linecap="round" />
      <!-- Text -->
      <text x="135" y="203" font-family="'Inter', 'Arial Black', sans-serif" font-size="34" font-weight="700" fill="#cc1133" letter-spacing="14">Publishing</text>
      <!-- Right line segment -->
      <line x1="470" y1="192" x2="580" y2="192" stroke="#cc1133" stroke-width="4.5" stroke-linecap="round" />

      <!-- Tagline: "Look. Ask. Think a second time." -->
      <text x="5" y="255" font-family="'Inter', 'Courier New', sans-serif" font-size="28" font-weight="400" letter-spacing="2">
        <tspan fill="#0a9396" font-weight="600">Look.</tspan>
        <tspan fill="#ee9b00" font-weight="600"> Ask.</tspan>
        <tspan fill="#fdfbf7" font-weight="300"> Think a second time.</tspan>
      </text>
    </g>
  </g>
</svg>
